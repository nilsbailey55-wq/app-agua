# Configuración nixpacks para Railway
# Agrega las dependencias de sistema necesarias para WeasyPrint (Pango/Cairo)
# y Pillow. Sin esto, WeasyPrint falla con "cannot load library 'libgobject-2.0-0'".

[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libpangoft2-1.0-0",
  "libcairo2",
  "libharfbuzz0b",
  "libgdk-pixbuf-2.0-0",
  "fonts-dejavu-core",
  "fonts-liberation2",
]
# Asegura que cffi/ctypes encuentre libgobject y compañía en runtime
[variables]
LD_LIBRARY_PATH = "/usr/lib/x86_64-linux-gnu:/usr/lib"
